<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scatto guidato bike fit</title>
<style>
/* Schermata di scatto guidato: fotocamera a tutto schermo, livella a bolla, sagoma di riferimento, autoscatto quando il telefono è in bolla. */
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,sans-serif;overflow:hidden}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#o{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:fixed;left:0;right:0;padding:12px max(12px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.45)}
.top{top:0;padding-top:max(12px,env(safe-area-inset-top))}
.bot{bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom))}
button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #fff6;background:#0008;color:#fff;font:600 15px system-ui}
button.on{background:#fff;color:#000}
#go{background:#e8ff3a;color:#000;border:0;min-width:140px}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;font:800 64px system-ui;text-shadow:0 2px 12px #000;pointer-events:none}
#info{position:fixed;left:0;right:0;bottom:92px;text-align:center;font:600 15px system-ui;text-shadow:0 1px 6px #000;pointer-events:none}
#start,#rev{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#111;text-align:center}
#rev{display:none}
#rev img{max-width:100%;max-height:60vh;border-radius:8px}
#rev .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#start p{max-width:30em;color:#ccc}
#err{color:#ff8a8a}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="o"></canvas>
<div class="bar top" id="modes">
  <button data-m="profilo" class="on">Profilo</button>
  <button data-m="fronte">Fronte</button>
  <button data-m="piede">Piede su A4</button>
</div>
<div id="msg"></div>
<div id="info"></div>
<div class="bar bot"><button id="go">Autoscatto 10 s</button></div>

<div id="start">
  <h2>Scatto guidato</h2>
  <p>Telefono appoggiato ad altezza anca, a circa 3 m. Corpo intero dentro le due linee orizzontali. La foto parte quando il pallino è nel verde o nel giallo; nel rosso non scatta.</p>
  <button id="ok" style="background:#e8ff3a;color:#000;border:0">Apri la fotocamera</button>
  <p id="err"></p>
</div>

<div id="rev">
  <img id="img" alt="Foto scattata">
  <p id="meta"></p>
  <div class="row">
    <button id="share">Condividi</button>
    <button id="save">Salva</button>
    <button id="again">Rifai</button>
  </div>
</div>

<script>
{
const $=id=>document.getElementById(id);
const v=$('v'),o=$('o'),ctx=o.getContext('2d');
let mode='profilo',tilt={a:99,b:99},stream=null,phase='idle',t0=0,steady=0,lastBlob=null,lastName='';
const TOL=1.0,WARN=5.0,SCALE=7; // gradi: verde ≤1°, giallo ≤5° (correggibile), rosso oltre (foto non valida); SCALE = gradi al bordo del quadrante

$('modes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;
  for(const x of $('modes').children)x.classList.toggle('on',x===b);
});

function onMotion(e){
  const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;
  let a,b;
  if(mode==='piede'){ // telefono orizzontale, fotocamera verso il pavimento
    a=Math.atan2(g.y,Math.abs(g.z))*180/Math.PI;
    b=Math.atan2(g.x,Math.abs(g.z))*180/Math.PI;
  }else{ // telefono verticale
    a=Math.atan2(g.z,Math.abs(g.y))*180/Math.PI; // avanti/indietro
    b=Math.atan2(g.x,Math.abs(g.y))*180/Math.PI; // rotazione laterale
  }
  const k=.08;
  tilt.a=tilt.a>90?a:tilt.a+(a-tilt.a)*k;
  tilt.b=tilt.b>90?b:tilt.b+(b-tilt.b)*k;
}

$('ok').addEventListener('click',async()=>{
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
      await DeviceMotionEvent.requestPermission();
    }
    addEventListener('devicemotion',onMotion);
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}});
    v.srcObject=stream;await v.play();
    $('start').style.display='none';
    try{await document.documentElement.requestFullscreen()}catch(_){}
    requestAnimationFrame(loop);
  }catch(err){
    $('err').textContent='Non riesco ad aprire la fotocamera ('+(err.name||err)+'). La pagina va aperta in Chrome da un indirizzo https.';
  }
});

$('go').addEventListener('click',()=>{
  if(phase==='idle'){phase='count';t0=performance.now();$('go').textContent='Annulla'}
  else{phase='idle';$('go').textContent='Autoscatto 10 s';$('msg').textContent=''}
});

function zone(){const m=Math.hypot(tilt.a,tilt.b);return m<=TOL?'verde':m<=WARN?'giallo':'rosso'}

function drawGuides(W,H,ok){
  ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.beginPath();
  if(mode==='piede'){
    // rettangolo A4 in verticale, 70% dell'altezza
    const h=H*.7,w=h*21/29.7,x=(W-w)/2,y=(H-h)/2;
    ctx.rect(x,y,w,h);
    ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='600 14px system-ui';ctx.textAlign='center';
    ctx.fillText('tallone contro questo bordo',W/2,y+h+20);
    ctx.fillText('foglio intero nel rettangolo',W/2,y-10);
  }else{
    const top=H*.12,bot=H*.88;
    ctx.moveTo(0,top);ctx.lineTo(W,top);
    ctx.moveTo(0,bot);ctx.lineTo(W,bot);
    ctx.moveTo(W/2,top);ctx.lineTo(W/2,bot);
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='600 14px system-ui';ctx.textAlign='left';
    ctx.fillText('testa sotto questa linea',12,top-8);
    ctx.fillText('piedi sopra questa linea',12,bot+20);
  }
  // livella a bolla
  const R=72,cx=W-R-16,cy=H*.18+R,s=R/SCALE;
  ctx.fillStyle='rgba(255,60,60,.45)';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,210,0,.55)';ctx.beginPath();ctx.arc(cx,cy,WARN*s,0,7);ctx.fill();
  ctx.fillStyle='rgba(60,255,110,.75)';ctx.beginPath();ctx.arc(cx,cy,TOL*s,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  const bx=Math.max(-R,Math.min(R,tilt.b*s)),by=Math.max(-R,Math.min(R,tilt.a*s));
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx-bx,cy+by,6,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='600 13px system-ui';ctx.textAlign='center';
  const fa=Math.abs(tilt.a)>45?'–':tilt.a.toFixed(1)+'°',fb=Math.abs(tilt.b)>45?'–':tilt.b.toFixed(1)+'°';
  ctx.fillText(fa+' / '+fb,cx,cy+R+18);
}

function loop(t){
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;
  if(o.width!==W*dpr){o.width=W*dpr;o.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  ctx.clearRect(0,0,W,H);
  const z=zone(),ok=z!=='rosso';
  drawGuides(W,H,ok);
  const noSensor=tilt.a>90;
  $('info').textContent=noSensor?'Sensore di inclinazione non disponibile':(z==='verde'?'In bolla':z==='giallo'?'Inclinazione correggibile: la foto vale':'Troppo inclinato: la foto non vale');
  if(phase==='count'){
    const left=10-(t-t0)/1000;
    if(left>0){$('msg').textContent=Math.ceil(left)}
    else{phase='wait';steady=0}
  }
  if(phase==='wait'){
    if(ok||noSensor){steady+=16;$('msg').textContent='Fermo…';if(steady>1000)shoot()}
    else{steady=0;$('msg').textContent='Livella'}
  }
  requestAnimationFrame(loop);
}

function beep(){
  try{const a=new AudioContext(),os=a.createOscillator();os.frequency.value=1200;os.connect(a.destination);os.start();os.stop(a.currentTime+.15)}catch(_){}
}

async function shoot(){
  phase='busy';$('msg').textContent='';
  const ta=tilt.a,tb=tilt.b,zz=zone();
  let blob=null;
  try{
    const tr=stream.getVideoTracks()[0];
    if('ImageCapture' in window){blob=await new ImageCapture(tr).takePhoto()}
  }catch(_){}
  if(!blob){
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
  }
  beep();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  lastName=`bikefit_${mode}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${zz}_incl${ta.toFixed(1)}_${tb.toFixed(1)}.jpg`;
  lastBlob=blob;
  $('img').src=URL.createObjectURL(blob);
  $('meta').textContent=`${mode} · ${zz} · inclinazione ${ta.toFixed(1)}° / ${tb.toFixed(1)}°`;
  $('rev').style.display='flex';
}

$('again').addEventListener('click',()=>{
  $('rev').style.display='none';phase='idle';$('go').textContent='Autoscatto 10 s';
});
$('save').addEventListener('click',()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=lastName;document.body.appendChild(a);a.click();a.remove();
});
$('share').addEventListener('click',async()=>{
  const f=new File([lastBlob],lastName,{type:'image/jpeg'});
  try{await navigator.share({files:[f],title:lastName})}catch(_){ $('save').click() }
});
}
</script>
</body>
</html>
